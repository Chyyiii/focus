# OpenSpec: контекст проекта FOCUS (читается ИИ-ассистентом перед каждой задачей)
schema: spec-driven

context: |
  Продукт: FOCUS, личная система управления жизнью (финансы, задачи, привычки, дневник).
  Видение, роли и дорожная карта: docs/MASTER_PLAN.md. Он главнее этого файла.
  Технический стек:
    - Один файл index.html (HTML + CSS + JavaScript, без сборки и без зависимостей).
    - Данные: localStorage (ключи kassa-*). В артефакте Claude: облачные документы (_save, _cats, _ui, _rec, _tpl, _debt, _hab).
    - PWA: manifest.webmanifest, sw.js (кэш kassa-vN), иконки.
    - Хостинг: GitHub Pages, файлы пока загружаются вручную.
  Язык интерфейса и документации: русский. Основное устройство: телефон (iPhone), затем компьютер.
  Бренд: тема «Жар» (Ember), фирменная четырёхлучевая звезда, слоган «ПЛАНИРУЙ • КОНТРОЛИРУЙ • РАЗВИВАЙСЯ».

rules:
  proposal:
    - Указывай номер задачи FOCUS-NNN, цель и причину.
    - Описывай текущее и требуемое поведение, ограничения.
  specs:
    - Заголовки Requirement и Scenario, слова SHALL и MUST, WHEN и THEN оставляй на английском. Текст пиши по-русски.
  tasks:
    - В конце каждого списка задач обязательны пункты проверки: данные, консоль, мобильная вёрстка, экспорт и импорт копии.

constraints:
  - Не переписывать приложение целиком.
  - Не удалять работающие функции и пользовательские данные.
  - Не менять структуру хранения данных без плана миграции.
  - Не заменять финансовую логику без необходимости.
  - Крупные изменения только с резервной копией и возможностью отката.
  - Каждая публикация: поднять номер кэша в sw.js (kassa-vN).
  - Не публиковать непроверенные изменения в основную версию (ветка main).
